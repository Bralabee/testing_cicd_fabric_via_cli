# ─────────────────────────────────────────────────────────────────────────────
# Demo Project — Feature Workspace Configuration
# ─────────────────────────────────────────────────────────────────────────────
#
# Minimal feature workspace config for isolated development.
# Items (lakehouses, notebooks) are inherited via Git sync — only folders,
# principals, and workspace metadata need to be defined here.
# ─────────────────────────────────────────────────────────────────────────────

workspace:
  name: ${PROJECT_PREFIX}
  display_name: ${PROJECT_PREFIX}
  description: Feature workspace for demo project development
  capacity_id: ${FABRIC_CAPACITY_ID}
  domain: ${FABRIC_DOMAIN_NAME}
  git_repo: ${GIT_REPO_URL}
  git_branch: main
  git_directory: /demo

environments:
  dev:
    workspace:
      name: ${PROJECT_PREFIX}
      capacity_id: ${FABRIC_CAPACITY_ID}

# ── 8-folder convention (must match base_workspace.yaml) ────────────────────
folders:
  - "000 Orchestrate"
  - "100 Ingest"
  - "200 Store"
  - "300 Prepare"
  - "400 Model"
  - "500 Visualize"
  - "999 Libraries"
  - "Archive"

# ── Access control ──────────────────────────────────────────────────────────
# Governance principals (shared across all projects in this repo)
principals:
  - id: "${AZURE_CLIENT_ID}"
    type: ServicePrincipal
    role: Admin
    description: Automation Service Principal
  - id: "${ADDITIONAL_ADMIN_PRINCIPAL_ID}"
    type: Group
    role: Admin
    description: IT governance admin group
  - id: "${ADDITIONAL_CONTRIBUTOR_PRINCIPAL_ID}"
    type: Group
    role: Contributor
    description: Governance contributor group
  # Project-specific principals
  - id: "${DEMO_ADMIN_ID}"
    type: Group
    role: Admin
    description: Demo project admins
  - id: "${DEMO_MEMBERS_ID}"
    type: Group
    role: Member
    description: Demo project team members
