# ─────────────────────────────────────────────────────────────────────────────
# Standard Data Product — Feature Workspace Template
# ─────────────────────────────────────────────────────────────────────────────
#
# TEMPLATE — Minimal feature workspace config.
# Feature workspaces inherit items (lakehouses, notebooks) via Git sync.
# Only folders, principals, and workspace metadata need to be defined here.
#
# Replace /CHANGE-ME with your project slug (must match base_workspace.yaml).
# ─────────────────────────────────────────────────────────────────────────────

workspace:
  name: ${PROJECT_PREFIX}
  display_name: ${PROJECT_PREFIX}
  description: Feature workspace for isolated development
  capacity_id: ${FABRIC_CAPACITY_ID}
  domain: ${FABRIC_DOMAIN_NAME}
  git_repo: ${GIT_REPO_URL}
  git_branch: main
  git_directory: /CHANGE-ME

environments:
  dev:
    workspace:
      name: ${PROJECT_PREFIX}
      capacity_id: ${FABRIC_CAPACITY_ID}

# ── 8-folder convention (must match base_workspace.yaml) ────────────────────
folders:
  - "000 Orchestrate"
  - "100 Ingest"
  - "200 Store"
  - "300 Prepare"
  - "400 Model"
  - "500 Visualize"
  - "999 Libraries"
  - "Archive"

# ── Access control ──────────────────────────────────────────────────────────
# Governance principals (shared across all projects in this repo)
# Project-specific principals (unique per project — set via GitHub Secrets)
principals:
  - id: "${AZURE_CLIENT_ID}"
    type: ServicePrincipal
    role: Admin
    description: Automation Service Principal
  - id: "${ADDITIONAL_ADMIN_PRINCIPAL_ID}"
    type: Group
    role: Admin
    description: IT governance admin group
  - id: "${ADDITIONAL_CONTRIBUTOR_PRINCIPAL_ID}"
    type: Group
    role: Contributor
    description: Governance contributor group
  - id: "${CHANGEME_ADMIN_ID}"
    type: Group
    role: Admin
    description: "Project admins — set via <PROJECT>_ADMIN_ID secret"
  - id: "${CHANGEME_MEMBERS_ID}"
    type: Group
    role: Member
    description: "Project team members — set via <PROJECT>_MEMBERS_ID secret"
