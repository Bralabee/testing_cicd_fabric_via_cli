# ─────────────────────────────────────────────────────────────────────────────
# Standard Data Product — Base Workspace Template
# ─────────────────────────────────────────────────────────────────────────────
#
# TEMPLATE — Copy this folder to config/projects/<your_project>/
#
# 8-folder convention (replaces Bronze/Silver/Gold):
#   000 Orchestrate  — Pipelines, Dataflows, scheduling
#   100 Ingest       — Eventstreams, real-time sources
#   200 Store        — Lakehouses (Bronze + Silver layers)
#   300 Prepare      — Notebooks, Spark jobs (transformation)
#   400 Model        — Warehouses, Semantic Models
#   500 Visualize    — Reports, Dashboards
#   999 Libraries    — Shared Environments, libraries
#   Archive          — Deprecated / retired items
#
# Lifecycle:
#   1. Deploy this config → creates Dev workspace with Git sync to `main`
#   2. Feature branches create isolated workspaces (feature_workspace.yaml)
#   3. Feature merges to `main` → Dev workspace auto-syncs via Fabric Git Sync
#   4. GitHub Actions calls `fabric-cicd promote` → Dev → Test → Prod
#   5. `organize-folders` runs post-promotion to restore folder assignments
#
# Placeholders:
#   CHANGE-ME         — Replace with your project display name
#   /CHANGE-ME        — Replace with your project slug (git_directory)
#   CHANGEME_ADMIN_ID — Replace with <PROJECT>_ADMIN_ID
#   CHANGEME_MEMBERS_ID — Replace with <PROJECT>_MEMBERS_ID
# ─────────────────────────────────────────────────────────────────────────────

workspace:
  name: "CHANGE-ME [DEV]"
  display_name: "CHANGE-ME [DEV]"
  description: Standard data product workspace
  capacity_id: ${FABRIC_CAPACITY_ID}
  git_repo: ${GIT_REPO_URL}
  git_branch: main
  git_directory: /CHANGE-ME

environments:
  dev:
    workspace:
      name: "CHANGE-ME [DEV]"
      capacity_id: ${FABRIC_CAPACITY_ID}

# ── 8-folder convention ─────────────────────────────────────────────────────
folders:
  - "000 Orchestrate"
  - "100 Ingest"
  - "200 Store"
  - "300 Prepare"
  - "400 Model"
  - "500 Visualize"
  - "999 Libraries"
  - "Archive"

# ── Folder rules — maps Fabric item types to folders ────────────────────────
folder_rules:
  - type: DataPipeline
    folder: "000 Orchestrate"
  - type: DataflowGen2
    folder: "000 Orchestrate"
  - type: Eventstream
    folder: "100 Ingest"
  - type: Lakehouse
    folder: "200 Store"
  - type: Notebook
    folder: "300 Prepare"
  - type: SparkJobDefinition
    folder: "300 Prepare"
  - type: Warehouse
    folder: "400 Model"
  - type: SemanticModel
    folder: "400 Model"
  - type: Report
    folder: "500 Visualize"
  - type: Dashboard
    folder: "500 Visualize"
  - type: Environment
    folder: "999 Libraries"

# ── Lakehouse resources ─────────────────────────────────────────────────────
lakehouses:
  - name: lh_bronze
    folder: "200 Store"
    description: Raw data landing zone
  - name: lh_silver
    folder: "200 Store"
    description: Cleansed and conformed data

# ── Access control ──────────────────────────────────────────────────────────
# Governance principals (shared across all projects in this repo)
# Project-specific principals (unique per project — set via GitHub Secrets)
principals:
  - id: "${AZURE_CLIENT_ID}"
    type: ServicePrincipal
    role: Admin
    description: Automation Service Principal
  - id: "${ADDITIONAL_ADMIN_PRINCIPAL_ID}"
    type: Group
    role: Admin
    description: IT governance admin group
  - id: "${ADDITIONAL_CONTRIBUTOR_PRINCIPAL_ID}"
    type: Group
    role: Contributor
    description: Governance contributor group
  - id: "${CHANGEME_ADMIN_ID}"
    type: Group
    role: Admin
    description: "Project admins — set via <PROJECT>_ADMIN_ID secret"
  - id: "${CHANGEME_MEMBERS_ID}"
    type: Group
    role: Member
    description: "Project team members — set via <PROJECT>_MEMBERS_ID secret"

# ── Deployment Pipeline — connects Dev → Test → Prod ────────────────────────
deployment_pipeline:
  pipeline_name: "CHANGE-ME - Pipeline"
  stages:
    development:
      workspace_name: "CHANGE-ME [DEV]"
      capacity_id: ${FABRIC_CAPACITY_ID}
    test:
      workspace_name: "CHANGE-ME [TEST]"
      capacity_id: ${FABRIC_CAPACITY_ID_TEST:-FABRIC_CAPACITY_ID}
    production:
      workspace_name: "CHANGE-ME [PROD]"
      capacity_id: ${FABRIC_CAPACITY_ID_PROD:-FABRIC_CAPACITY_ID}
