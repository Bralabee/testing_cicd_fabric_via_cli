# ─────────────────────────────────────────────────────────────────────────────
# Deploy to Dev — Auto-Sync & Organize Folders
#
# Triggered on push to main (after PR merge) or manual dispatch.
# Organizes folder structure in Dev workspaces after Git sync applies changes.
#
# Flow:
#   PR merged → main updated → Fabric Git Sync pulls changes automatically
#   → This workflow fires → CLI organizes folders (items land at root after sync)
# ─────────────────────────────────────────────────────────────────────────────

name: Deploy to Dev
run-name: "Deploy to Dev (Auto-Sync) — Commit: ${{ github.sha }}"

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.github/CODEOWNERS'
      - '.github/dependabot.yml'
      - '.github/copilot-instructions.md'
      - '.github/PULL_REQUEST_TEMPLATE.md'

  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy-dev:
    name: Deploy to Dev (Auto-Sync)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    env:
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      SP_OBJECT_ID: ${{ secrets.SP_OBJECT_ID }}
      FABRIC_CAPACITY_ID: ${{ secrets.FABRIC_CAPACITY_ID }}
      FABRIC_CAPACITY_ID_TEST: ${{ secrets.FABRIC_CAPACITY_ID_TEST }}
      FABRIC_CAPACITY_ID_PROD: ${{ secrets.FABRIC_CAPACITY_ID_PROD }}
      PROJECT_PREFIX: ${{ vars.PROJECT_PREFIX || 'fabric-cicd-demo' }}
      # Governance principals
      ADDITIONAL_ADMIN_PRINCIPAL_ID: ${{ secrets.ADDITIONAL_ADMIN_PRINCIPAL_ID }}
      ADDITIONAL_CONTRIBUTOR_PRINCIPAL_ID: ${{ secrets.ADDITIONAL_CONTRIBUTOR_PRINCIPAL_ID }}
      # Project-specific principals
      DEMO_ADMIN_ID: ${{ secrets.DEMO_ADMIN_ID }}
      DEMO_MEMBERS_ID: ${{ secrets.DEMO_MEMBERS_ID }}
      SALES_ANALYTICS_ADMIN_ID: ${{ secrets.SALES_ANALYTICS_ADMIN_ID }}
      SALES_ANALYTICS_MEMBERS_ID: ${{ secrets.SALES_ANALYTICS_MEMBERS_ID }}

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 2

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        env:
          GIT_AUTH_TOKEN: ${{ secrets.FABRIC_GITHUB_TOKEN }}
        run: |
          pip install --upgrade pip
          pip install pyyaml
          pip install ms-fabric-cli==${{ vars.FABRIC_CLI_VERSION || '1.3.1' }}
          pip install "git+https://${GIT_AUTH_TOKEN}@${{ vars.CLI_REPO_URL || 'github.com/BralaBee-LEIT/usf_fabric_cli_cicd_codebase' }}.git@${{ vars.CLI_REPO_REF || 'v1.8.3' }}"

      - name: Verify credentials
        run: |
          for var in AZURE_TENANT_ID AZURE_CLIENT_ID AZURE_CLIENT_SECRET; do
            if [ -z "${!var}" ]; then
              echo "::error::Required secret $var is not configured"
              exit 1
            fi
          done
          echo "Credentials verified"

      - name: Determine changed projects
        id: changes
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "mode=ALL" >> $GITHUB_OUTPUT
            echo "Manual dispatch — will process ALL projects"
          else
            CHANGED_PROJECTS=""
            # Check for changes in config/projects/<project>/ directories
            CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "")

            for f in $CHANGED_FILES; do
              # Match config/projects/<project>/ or <project>/ patterns
              if echo "$f" | grep -qE '^config/projects/([^/]+)/'; then
                PROJECT=$(echo "$f" | sed -E 's|^config/projects/([^/]+)/.*|\1|')
                if [ "$PROJECT" != "_templates" ]; then
                  CHANGED_PROJECTS="$CHANGED_PROJECTS $PROJECT"
                fi
              elif echo "$f" | grep -qE '^([^/.][^/]*)/'; then
                PROJECT=$(echo "$f" | sed -E 's|^([^/]+)/.*|\1|')
                # Only include if it has a base_workspace.yaml
                if [ -f "config/projects/${PROJECT}/base_workspace.yaml" ]; then
                  CHANGED_PROJECTS="$CHANGED_PROJECTS $PROJECT"
                fi
              fi
            done

            # Deduplicate
            CHANGED_PROJECTS=$(echo "$CHANGED_PROJECTS" | tr ' ' '\n' | sort -u | tr '\n' ' ' | xargs)

            if [ -z "$CHANGED_PROJECTS" ]; then
              echo "mode=NONE" >> $GITHUB_OUTPUT
              echo "No project changes detected"
            else
              echo "mode=CHANGED" >> $GITHUB_OUTPUT
              echo "projects=$CHANGED_PROJECTS" >> $GITHUB_OUTPUT
              echo "Changed projects: $CHANGED_PROJECTS"
            fi
          fi

      - name: Organize folders
        if: steps.changes.outputs.mode != 'NONE'
        run: |
          MODE="${{ steps.changes.outputs.mode }}"
          ORGANIZED=0
          SKIPPED=0
          ERRORS=0

          for project_dir in config/projects/*/; do
            PROJECT=$(basename "$project_dir")

            # Skip _templates
            if [ "$PROJECT" = "_templates" ]; then
              continue
            fi

            CONFIG_FILE="${project_dir}base_workspace.yaml"
            if [ ! -f "$CONFIG_FILE" ]; then
              continue
            fi

            # Skip unchanged projects (unless ALL mode)
            if [ "$MODE" = "CHANGED" ]; then
              if ! echo " ${{ steps.changes.outputs.projects }} " | grep -q " $PROJECT "; then
                echo "Skipping $PROJECT (no changes detected)"
                SKIPPED=$((SKIPPED + 1))
                continue
              fi
            fi

            # Check if project has folder_rules
            HAS_FOLDER_RULES=$(python3 -c "
          import yaml
          config = yaml.safe_load(open('$CONFIG_FILE'))
          rules = config.get('folder_rules', [])
          print('yes' if rules else 'no')
          " 2>/dev/null || echo "no")

            if [ "$HAS_FOLDER_RULES" != "yes" ]; then
              echo "Skipping $PROJECT (no folder_rules configured)"
              SKIPPED=$((SKIPPED + 1))
              continue
            fi

            # Resolve workspace name
            WORKSPACE_NAME=$(python3 -c "
          import os, re, yaml
          config = yaml.safe_load(open('$CONFIG_FILE'))
          name = config.get('workspace', {}).get('name', '')
          name = re.sub(r'\\\$\{(\w+)\}', lambda m: os.environ.get(m.group(1), m.group(0)), name)
          print(name)
          " 2>/dev/null)

            echo "Organizing folders for: $PROJECT (workspace: $WORKSPACE_NAME)"

            ORGANIZE_EXIT=0
            fabric-cicd organize-folders \
              "$CONFIG_FILE" \
              --env dev || ORGANIZE_EXIT=$?

            if [ $ORGANIZE_EXIT -eq 2 ]; then
              echo "  No folder changes needed (exit code 2)"
              SKIPPED=$((SKIPPED + 1))
            elif [ $ORGANIZE_EXIT -ne 0 ]; then
              echo "::warning::organize-folders failed for $PROJECT (exit code $ORGANIZE_EXIT)"
              ERRORS=$((ERRORS + 1))
            else
              echo "  Folders organized successfully"
              ORGANIZED=$((ORGANIZED + 1))
            fi
          done

          echo "ORGANIZED=$ORGANIZED" >> $GITHUB_ENV
          echo "SKIPPED=$SKIPPED" >> $GITHUB_ENV
          echo "ERRORS=$ERRORS" >> $GITHUB_ENV

      - name: Report success
        if: always()
        run: |
          echo "## Deploy to Dev (Auto-Sync)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|:---|:---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Mode** | ${{ steps.changes.outputs.mode || 'N/A' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Folders Organized** | ${ORGANIZED:-0} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Skipped** | ${SKIPPED:-0} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Errors** | ${ERRORS:-0} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Triggered by** | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
