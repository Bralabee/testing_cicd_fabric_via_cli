# ─────────────────────────────────────────────────────────────────────────────
# Feature Workspace Creation — GitHub Actions Workflow
#
# Triggered when a feature/* branch is pushed. Creates an isolated Fabric
# workspace connected to the feature branch, following Microsoft's Scenario 2
# (develop in a separate workspace) from the official Git integration docs.
#
# Ref: https://learn.microsoft.com/en-us/fabric/cicd/git-integration/manage-branches
# ─────────────────────────────────────────────────────────────────────────────

name: Create Feature Workspace
run-name: "Feature WS Create — ${{ github.event_name == 'workflow_dispatch' && format('feature/{0}', inputs.feature_name) || github.ref_name }}"

on:
  push:
    branches:
      - 'feature/**'

  # Manual trigger — allows creating feature workspaces from the GitHub UI
  workflow_dispatch:
    inputs:
      feature_name:
        description: 'Feature name (e.g., add-gold-table). Will create branch feature/<name>'
        required: true
        type: string
      create_branch:
        description: 'Auto-create the feature branch in the repo'
        required: false
        type: boolean
        default: true

# Only allow one workspace creation at a time per branch
concurrency:
  group: feature-ws-${{ github.event_name == 'workflow_dispatch' && format('feature/{0}', inputs.feature_name) || github.ref_name }}
  cancel-in-progress: false

jobs:
  create-feature-workspace:
    if: >
      (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/feature/')) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    env:
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      SP_OBJECT_ID: ${{ secrets.SP_OBJECT_ID }}
      GITHUB_TOKEN_FABRIC: ${{ secrets.FABRIC_GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.FABRIC_GITHUB_TOKEN }}
      FABRIC_CAPACITY_ID: ${{ secrets.FABRIC_CAPACITY_ID }}
      FABRIC_CAPACITY_ID_TEST: ${{ secrets.FABRIC_CAPACITY_ID_TEST }}
      FABRIC_CAPACITY_ID_PROD: ${{ secrets.FABRIC_CAPACITY_ID_PROD }}
      DEV_ADMIN_OBJECT_ID: ${{ secrets.DEV_ADMIN_OBJECT_ID }}
      GIT_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
      PROJECT_PREFIX: ${{ vars.PROJECT_PREFIX || 'fabric-cicd-demo' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install CLI tool
        run: |
          pip install --upgrade pip
          pip install ms-fabric-cli==${{ vars.FABRIC_CLI_VERSION || '1.3.1' }}
          pip install "git+https://${{ secrets.FABRIC_GITHUB_TOKEN }}@${{ vars.CLI_REPO_URL || 'github.com/BralaBee-LEIT/usf_fabric_cli_cicd_codebase' }}.git@${{ vars.CLI_REPO_REF || 'v1.8.0' }}"

      - name: Extract branch info
        id: branch
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            BRANCH_NAME="feature/${{ inputs.feature_name }}"
          else
            BRANCH_NAME="${{ github.ref_name }}"
          fi
          FEATURE_NAME="${BRANCH_NAME#feature/}"
          # Sanitise for Fabric workspace naming (alphanumeric, hyphens, underscores)
          WORKSPACE_SUFFIX=$(echo "$FEATURE_NAME" | sed 's/[^a-zA-Z0-9_-]/_/g')
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT
          echo "feature_name=$FEATURE_NAME" >> $GITHUB_OUTPUT
          echo "workspace_suffix=$WORKSPACE_SUFFIX" >> $GITHUB_OUTPUT
          echo "📌 Branch: $BRANCH_NAME"

      - name: Create feature branch (manual trigger only)
        if: github.event_name == 'workflow_dispatch' && inputs.create_branch
        run: |
          BRANCH="${{ steps.branch.outputs.branch_name }}"
          echo "🌿 Creating branch: $BRANCH"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "Branch $BRANCH already exists — skipping creation"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git checkout -b "$BRANCH"
            git push origin "$BRANCH"
            echo "✅ Branch $BRANCH created from main"
          fi

      - name: Verify credentials
        run: |
          for var in AZURE_TENANT_ID AZURE_CLIENT_ID AZURE_CLIENT_SECRET FABRIC_CAPACITY_ID FABRIC_CAPACITY_ID_TEST FABRIC_CAPACITY_ID_PROD; do
            if [ -z "${!var}" ]; then
              echo "::error::Required secret $var is not configured"
              exit 1
            fi
          done
          echo "✅ All required credentials verified"

      - name: Deploy feature workspace
        env:
          CONFIG_OVERRIDE: ${{ vars.FEATURE_WORKSPACE_CONFIG || '' }}
        run: |
          # Priority: repo variable > naming convention search
          if [ -n "$CONFIG_OVERRIDE" ]; then
            CONFIG_FILE="$CONFIG_OVERRIDE"
          else
            CONFIG_FILE=$(find config/projects -name "feature_*.yaml" -type f | head -1)
          fi

          if [ -z "$CONFIG_FILE" ] || [ ! -f "$CONFIG_FILE" ]; then
            echo "::error::Feature workspace config not found. Either set the FEATURE_WORKSPACE_CONFIG repo variable or add a feature_*.yaml file under config/projects/."
            exit 1
          fi

          echo "📦 Creating feature workspace for branch: ${{ steps.branch.outputs.branch_name }}"
          echo "📋 Using config: $CONFIG_FILE"

          fabric-cicd deploy \
            "$CONFIG_FILE" \
            --env dev \
            --branch "${{ steps.branch.outputs.branch_name }}" \
            --force-branch-workspace

      - name: Report workspace creation
        if: success()
        run: |
          echo "## ✅ Feature Workspace Created" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|:---|:---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | \`${{ steps.branch.outputs.branch_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Feature** | \`${{ steps.branch.outputs.feature_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Triggered by** | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY

      - name: Report failure
        if: failure()
        run: |
          echo "## ❌ Feature Workspace Creation Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Branch: \`${{ steps.branch.outputs.branch_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "Check the logs above for details." >> $GITHUB_STEP_SUMMARY
